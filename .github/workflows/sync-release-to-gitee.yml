name: Sync Release to Gitee

# 将 GitHub Release（标题、描述、构建产物附件）同步到 Gitee Release，
# 形成「Gitee 源码仓库 → GitHub 构建 → 回传 Gitee Release」的闭环。
#
# 触发：
# - GitHub Release 发布时（release.yml 的 softprops/action-gh-release
#   完成发布后会发出 published 事件，自动衔接本工作流）；
# - 手动触发（workflow_dispatch，输入 tag 名用于补录或测试）。
#
# 前置条件：
# 1. Gitee 私人令牌已存入仓库 Secret：GITEE_TOKEN
#    （Gitee → 设置 → 私人令牌，勾选 projects 权限）。
# 2. Gitee 仓库中已存在同名 tag（tag 随代码从 Gitee 同步而来）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要同步的 Release Tag（例如 v1.2.3）'
        required: true
        type: string

permissions:
  contents: read

env:
  GITEE_OWNER: 'zeronehost'
  GITEE_REPO: 'ribo-agent'

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    # 实测旧配置完整同步耗时约 39 分钟（Python 依赖安装 + 跨境上传附件），
    # 20 分钟会把成功运行误杀；留足余量到 60 分钟，但仍防止彻底挂死。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # action-gitee-release 每次运行都会 pip install；复用 pip 缓存可省去重复下载。
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gitee-release-${{ hashFiles('.github/workflows/sync-release-to-gitee.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-gitee-release-

      - name: Get Release Info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          RELEASE_INFO=$(gh release view "$TAG_NAME" --json name,body,targetCommitish,assets)
          {
            echo "release_name=$(echo "$RELEASE_INFO" | jq -r '.name')"
            echo "target_commitish=$(echo "$RELEASE_INFO" | jq -r '.targetCommitish')"
            echo "asset_count=$(echo "$RELEASE_INFO" | jq '.assets | length')"
            echo "release_body<<EOF"
            echo "$RELEASE_INFO" | jq -r '.body'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Release Assets
        id: check_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          ASSET_COUNT: ${{ steps.release_info.outputs.asset_count }}
        run: |
          mkdir -p release_assets
          # 无附件时 gh release download 会报错退出，这里按附件数提前跳过；
          # 有附件却下载失败必须报错，不能用 || true 吞掉网络/权限故障。
          if [ "$ASSET_COUNT" -gt 0 ]; then
            gh release download "$TAG_NAME" --dir release_assets
          fi
          if [ -z "$(ls -A release_assets)" ]; then
            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"
            echo "No assets found, syncing release metadata only."
          else
            echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"
            ls -la release_assets/
          fi

      - name: Create Gitee Release with Assets
        if: steps.check_assets.outputs.HAS_ASSETS == 'true'
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          gitee_release_name: ${{ steps.release_info.outputs.release_name }}
          gitee_release_body: ${{ steps.release_info.outputs.release_body }}
          gitee_target_commitish: ${{ steps.release_info.outputs.target_commitish }}
          gitee_upload_retry_times: 3
          gitee_files: |
            release_assets/*

      - name: Create Gitee Release (No Assets)
        if: steps.check_assets.outputs.HAS_ASSETS == 'false'
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          gitee_release_name: ${{ steps.release_info.outputs.release_name }}
          gitee_release_body: ${{ steps.release_info.outputs.release_body }}
          gitee_target_commitish: ${{ steps.release_info.outputs.target_commitish }}

      - name: Cleanup
        if: always()
        run: rm -rf release_assets/

      - name: Summary
        if: success()
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          echo "Synced release $TAG to Gitee."
          echo "https://gitee.com/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}/releases/tag/$TAG"
