# 阶段 6 插件端到端演示 CI：
# 仅在插件链路相关文件变更时运行 + 每晚 cron 防破窗。
# plugin-demo 现为根 workspace 成员（`examples/*`），e2e 内部调用
# `cargo build --target wasm32` 构建 PDK guest；这条独立 workflow 作为
# 插件链路的专项快速反馈，与 ci.yml 的 `cargo test --workspace` 互为补充。
name: plugin-demo

on:
  pull_request:
    paths:
      - "crates/plugins/**"
      - "crates/pdk/**"
      - "crates/pdk-macro/**"
      - "crates/tools/src/**"
      - "crates/core/src/message/tool.rs"
      - "examples/plugin-demo/**"
  schedule:
    - cron: "0 2 * * *" # 每晚跑一次，防止长期不动的破窗

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: plugin-demo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # e2e 测试内部会先构建 wasm32 guest 再走宿主全链路
      # （加载 → 注册 → 执行 → 超时 / 越权断言），见 tests/e2e.rs
      - name: Run plugin-demo e2e tests
        run: cargo test -p plugin-demo --test e2e
