[package]
name = "plugin-demo"
description = "Ribo Agent 插件端到端演示（18_ §13.2）：PDK guest 构建 + 宿主全链路集成测试"
version = "0.0.0"
edition = "2024"
publish = false

# 独立 workspace：examples/ 目录位于 ra-plugins 包内，根 workspace 的
# members = ["crates/*"] 只匹配一层不会收编本目录；本声明是显式防御
# （且使本 crate 拥有自己的 target 目录，wasm32 产物路径可预期）。
[workspace]

[lib]
# cdylib：cargo build --target wasm32-unknown-unknown 产出 .wasm 二进制
# （rlib 不会生成 wasm 文件），rustc 对 wasm cdylib 默认导出 memory
crate-type = ["cdylib"]

[dependencies]
ra-plug-pdk = { path = "../../../pdk" }
serde_json = "1"

[dev-dependencies]
ra-plugins = { path = "../../" }
ra-tools = { path = "../../../tools" }
ra-core = { path = "../../../core" }
ra-agent = { path = "../../../agent" }
ra-cli = { path = "../../../cli" }
ra-provider = { path = "../../../provider" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
