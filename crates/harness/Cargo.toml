[package]
name = "ra-harness"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
description = "会话容器：持久化、上下文压缩、系统提示与技能加载"

[dependencies]
ra-core = { workspace = true }
ra-agent = { workspace = true }
ra-provider = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# start_paused 测试需要 test-util 特性（tokio 的 full 特性不包含它）；
# 摘要超时分支用虚拟时钟确定性驱动 SUMMARY_TIMEOUT。
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
ra-tools = { workspace = true }
toml.workspace = true
tracing-subscriber = { workspace = true }
time.workspace = true
reqwest = { workspace = true }
