# gateway_fallback 示例：三家真实提供商适配器
#
# 网关查询入口由 [routing].default 指定；降级规则按 [[routing.fallback]]
# 声明顺序逐条匹配（provider 级通配 → 有序 targets）。
#
# 任一分组的 base_url / api_key / models 缺失（或整文件被删除）
# 则回退到离线服务桩演示。

[routing]
default = { provider = "chat-primary", model = "gpt-4o-mini" }

# === 提供商定义 ===

[[providers]]
provider_id  = "chat-primary"
adapter     = "openai-chat"
base_url    = "https://api.openai.com/v1"
api_key     = "sk-..."

  [[providers.models]]
  id = "gpt-4o-mini"

[[providers]]
provider_id  = "responses-primary"
adapter     = "openai-responses"
base_url    = "https://api.openai.com/v1"
api_key     = "sk-..."

  [[providers.models]]
  id = "gpt-4o-mini"

[[providers]]
provider_id  = "anthropic-primary"
adapter     = "anthropic"
base_url    = "https://api.anthropic.com"
api_key     = "sk-ant-..."

  [[providers.models]]
  id = "claude-3-5-haiku-20241022"

# === 降级规则 ===
[[routing.fallback]]
match = { provider = "chat-primary" }
targets = [
  { provider = "responses-primary" },
  { provider = "anthropic-primary" },
]

[[routing.fallback]]
match = { provider = "responses-primary" }
targets = [{ provider = "anthropic-primary" }]
