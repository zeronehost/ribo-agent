# ra-cli 配置模板（与 crates/cli/src/config/schema.rs 六层 schema 一一对应）
#
# 用法：
#   复制本文件为 ribo.toml（未指定 --config 时自动探测的默认文件名）
#   并填入真实端点与密钥，或用 --config 指定任意路径；
#   密钥一律走 "$ENV_NAME" 占位，不落盘。
#
# 配置文件选择：显式 --config 优先；未指定时仅当 ribo.toml 存在才加载，
#   否则走全默认 Mock（ribo 与 ribo-tui 同规则）。
#
# 降级语义（启动横幅会打印 mode 与 warnings）：
#   - 本模板保持占位状态（your-* / example.com） → 整体回退 Mock 模式；
#   - 未指定 --config 且 ribo.toml 不存在          → 整体回退 Mock 模式；
#   - 某个 $ENV 密钥未设置                        → 局部降级：该 provider 跳过注册，
#     路由链中引用它的候选一并剔除；若 query_model 因此悬空 → 整体回退 Mock；
#   - 单个配置层解析失败（未知字段忽略除外）      → 该层保留默认 + warning。
#
# 六层 schema 相互独立、层间零交叉；下方各层值与代码 Default 一致。

# ── provider 层 ─────────────────────────────────────────────
# 根级字段：网关查询入口，必须是某个 provider 暴露的 model；
# 未配置时默认 "mock-model"。
query_model = "your-model-name"

# adapter 白名单：openai-chat | openai-responses | anthropic
# api_key 支持 "$ENV_NAME" 占位（运行时读环境变量，未设置则跳过该 provider）。
[[providers]]
provider_id = "chat-primary"
adapter = "openai-chat"
base_url = "https://your-endpoint.example.com"
api_key = "$OPENAI_API_KEY"
model = "your-model-name"

[[providers]]
provider_id = "anthropic-backup"
adapter = "anthropic"
base_url = "https://your-anthropic-endpoint.example.com"
api_key = "$ANTHROPIC_API_KEY"
model = "your-model-name"

# 跨提供方降级链：主 provider → 候选列表（须引用已注册的 provider_id）。
[routing.cross_provider]
"chat-primary" = ["anthropic-backup"]

# ── retry 层（GatewayConfig.retry）──────────────────────────
# 未配置字段显式取 RetryPolicy::default()（max_backoff 30s、multiplier 2.0）。
[retry]
max_retries = 3                # 默认 3（不含首次请求）
initial_backoff_ms = 500       # 默认 500，首次重试基础退避
jitter_ratio = 0.25            # 默认 0.25，延迟 ±25% 随机抖动

# ── compression 层（ContextConfig.compaction，运行期唯一真值）──
[compression]
enabled = false                # 默认 false：未显式开启绝不丢弃历史
trigger_ratio = 0.75           # 默认 0.75，估算 token 超过 context_window × 比例触发
keep_recent_turns = 4          # 默认 4，保留最近 4 个 user 轮
# summarizer_model = "..."     # Option 字段：注释掉即 None（默认），无摘要模型时
#                              # 压缩退化为纯滑窗；填写则用该模型生成摘要
max_summary_chars = 2048       # 默认 2048，摘要按字符截断

# ── session 层（REPL 会话状态）──────────────────────────────
[session]
default_key = "default"        # 默认 "default"，REPL 启动会话键（/new 轮换基准）
history_lines = 10             # 默认 10，/history 未带参数时的条数

# ── tools 层（ToolManager 注册）─────────────────────────────
[tools]
builtin_enabled = true         # 默认 true，注册全部内置工具（逐工具开关留阶段 6）
# fs_root = "tool-space"       # Option 字段：注释掉即 None（默认）→ 沙箱 = harness.root；
#                              # 填写则作为内置工具（fs 六件）的读写沙箱根——
#                              # 相对 harness.root 解析（恒位于 root 之下）；
#                              # 绝对路径或 ".." 逃逸 → warning + 回退 root

# ── harness 层（会话存储与技能）─────────────────────────────
[harness]
root = "."                     # 默认 "."（进程 cwd），会话 ./sessions/、日志 ./logs/；
                               # 可被命令行 --root 参数覆盖
skills_roots = ["skills"]      # 默认 ["skills"]，技能扫描根（可多个，按序加载，
                               # 相对 root 解析）
include_environment = true     # 默认 true，系统提示注入 <environment> 段


# ── global 层（全局域，跨项目共享；默认启用）─────────────────
# [global]
# enabled = true                 # 默认 true；目录不存在时自动禁用（非致命，R4）
# dir = "~/.config/ribo"         # 可选；命令行 --global-dir 优先；
#                                # 未设置时用平台默认配置目录 + /ribo。
#                                # 全局配置 settings.toml 与信任记录
#                                # trusted_projects.toml 位于该目录。
#
# ── plugins 层（阶段 6 WASM 插件装配，默认关闭）───────────────
# enabled = true 时启动期加载插件：扫描 roots 目录下全部 *.wasm
#（最小权限：无注入 config、ACL 全关）+ 逐条加载 entries 显式清单
#（可声明 ACL 与注入 config）。任一插件加载 / 注册失败 → 启动致命
# 错误（与 PluginRuntime 的 OnceLock 失败语义一致，禁止半装配）。
# [plugins]
# enabled = false
# roots = []                     # 相对 harness.root 的 .wasm 扫描目录
#
# [plugins.verify]               # Step C 来源校验（默认 require_signature = false）
# require_signature = true       # 生产须开启：每条插件声明都要有有效 Ed25519 签名
# trusted_keys = "keys.json"     # 相对 harness.root 的公钥白名单（缺失即启动致命）
#                                #   {"keys":[{"id":"release","public_key":"<64 hex>"}]}
#
# [[plugins.entries]]            # 显式清单：可逐插件声明 ACL 与 config
# path = "plugins/demo.wasm"     # 相对 harness.root；绝对路径 / ".." 逃逸 → 启动致命
# manifest = "manifest.json"     # 权威清单（B3.2；guest 自述降级为交叉校验）
# provenance = "provenance.json" # 侧载签名块（require_signature = true 时必需）
#                                #   {"signer_id":"release","signature":"<128 hex>","wasm_digest":"<64 hex>"}
#
# [plugins.entries.acl]          # 能力由宿主注入，不信任 guest 自述（默认全关）
# log = true
# storage = true
# http = true
# http_hosts = ["api.example.com"]  # http 出站白名单（空 = 实际不可出站）
# memory_limit_bytes = 16777216     # 可选：线性内存覆写（只能收紧 32MB）
# storage_quota_bytes = 262144      # 可选：storage 配额覆写（只能收紧 1MB）
# timeout_ceiling_ms = 5000         # 可选：单工具超时上限覆写（只能收紧 60s）
#
# [plugins.entries.config]       # 注入插件的 config（args 信封，18_ §9）
# greeting_prefix = "你好"
#
# ── 插件域声明（19_ Step 3）────────────────────────────────
# 注意区分：[plugins] 是「插件条目」（加载哪些 wasm），
#            [[plugins.domains]] 是「插件域」（外部资源根声明）。
# 域 id 匹配 ^[a-z][a-z0-9_]{0,31}$ 且跨域唯一；root 必须绝对路径、
# 存在且是目录，否则启动致命。fs 六件套通过 `scheme://相对路径` 访问域内资源，
# 无前缀路径仍走主沙箱根（行为不变）。
#
# [[plugins.domains]]
# id = "dataset"                  # fs 前缀名：read("dataset://a/b.jpg")
# root = "/mnt/datasets"          # 必须绝对；不存在 / 非目录 → 启动致命
# kind = "data"                   # plugins | skills | prompts | data | all
# read_only = true                # kind=data 默认 true；写入 → plugin.plugin_forbidden
#
# [[plugins.domains]]
# id = "company"
# root = "/opt/company/plugins"
# kind = "plugins"
# trusted = false                 # Step 4 代码信任用；项目自签无效（须 Global 域声明）
