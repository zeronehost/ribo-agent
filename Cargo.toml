[workspace]
members = [
  "crates/*",
  "internals/git-hook"
]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["jinbin <1447281971@qq.com>"]
edition = "2024"
publish = false
repository = "https://gitee.com/zeronehost/ribo-agent.git"
readme = "README.md"
license = "MulanPSL-2.0"

[workspace.dependencies]
# # 序列化
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"

# # 异步
# async-trait = "0.1"
# futures = "0.3"
# tokio = { version = "1", features = ["full"] }
# tokio-util = "0.7"
# async-stream = "0.3"

# # 网络请求
# reqwest = { version = "0.13.4", features = ["json", "stream"] }

# # 错误处理及日志
# thiserror = "2"
# tracing = "0.1"
# tracing-subscriber = "0.3"

# # 工具
# uuid = { version = "1.23", features = ["serde", "v4"] }
# chrono = { version = "0.4", features = ["serde"] }
# dashmap = "6.2"

async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
# uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
rand = "0.10"
dashmap = "6.2"
tempfile = "3"

jsonschema = "0.60"
glob = "0.3"
regex = "1"
evalexpr = "13.1"
toml = "1.2"
clap = { version = "4", features = ["derive"] }

# 
ra-core = { path = "./crates/core" }
ra-provider = { path = "./crates/provider" }
ra-tools = { path = "./crates/tools" }
ra-agent = { path = "./crates/agent" }
ra-harness = { path = "./crates/harness" }
